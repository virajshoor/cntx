name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: main
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.93.1
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            main/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('main/Cargo.lock') }}

      - name: C self-test with sanitizers
        run: |
          clang -std=c17 -D_POSIX_C_SOURCE=200809L -Wall -Wextra -Wpedantic -fsanitize=address,undefined \
            -I csrc \
            csrc/agent.c csrc/context.c csrc/permissions.c csrc/routing.c csrc/tools.c \
            tests/c_selftest.c -o /tmp/cntx-selftest
          /tmp/cntx-selftest

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      - name: Build
        run: cargo build

      - name: Package completeness
        run: cargo package --list

      - name: Clean install into a temporary root
        run: cargo install --path . --root /tmp/cntx-ci-root --quiet
